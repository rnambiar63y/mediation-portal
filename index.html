<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mediation Portal</title>
  <style>
    :root {
      --primary: #1a365d;
      --primary-light: #2b4c7e;
      --accent: #2563eb;
      --bg: #f1f5f9;
    }
    body { background: var(--bg); font-family: sans-serif; padding: 20px; }
    .dashboard { background: white; padding: 20px; margin-top: 20px; border-radius: 8px; }
  </style>
</head>
<body>

  <select id="roleSelect" onchange="switchRole()">
    <option value="mediator">Mediator</option>
    <option value="admin">Admin</option>
    <option value="user">User</option>
    <option value="guest">Guest</option>
  </select>

  <div id="mediatorView" class="dashboard">Mediator Dashboard - Access to mediation cases.</div>
  <div id="adminView" class="dashboard" style="display:none;">Admin Dashboard - System management.</div>
  <div id="userView" class="dashboard" style="display:none;">User Dashboard - View personal status.</div>
  <div id="guestView" class="dashboard" style="display:none;">Guest Dashboard - Public information.</div>

  <script>
    function switchRole() {
      const role = document.getElementById('roleSelect').value;
      document.getElementById('mediatorView').style.display = role === 'mediator' ? 'block' : 'none';
      document.getElementById('adminView').style.display = role === 'admin' ? 'block' : 'none';
      document.getElementById('userView').style.display = role === 'user' ? 'block' : 'none';
      document.getElementById('guestView').style.display = role === 'guest' ? 'block' : 'none';
    }
  </script>

</body>
</html>
