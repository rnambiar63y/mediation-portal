<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Court-Annexed Mediation Center Register & Portal</title>
  <style>
    :root {
      --primary: #1a365d;
      --primary-light: #2b4c7e;
      --accent: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --success-bg: #dcfce7;
      --success-text: #166534;
      --pending-bg: #fef3c7;
      --pending-text: #92400e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.5; }

    /* Top Header */
    header {
      background: var(--primary);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .brand { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .header-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

    .btn-header {
      background: rgba(255,255,255,0.14);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 7px 13px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-header:hover { background: rgba(255,255,255,0.25); }

    select.role-select {
      padding: 7px 12px;
      border-radius: 6px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      background: #fff;
