      });
      document.getElementById('manualContent').innerHTML = d.sections.map(sec => `
        <section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
          <h2 class="text-base font-bold text-[#0f2244] mb-3">${sec.title}</h2>
          <ul class="space-y-2 text-sm text-slate-700 list-disc pl-5">
            ${sec.items.map(i => `<li>${i}</li>`).join('')}

        </section>
